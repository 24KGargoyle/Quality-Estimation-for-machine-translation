services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: meeting_intel
      POSTGRES_PASSWORD: meeting_intel
      POSTGRES_DB: meeting_intel
    ports:
      - "5432:5432"
    volumes:
      - meeting_intel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_intel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://meeting_intel:meeting_intel@postgres:5432/meeting_intel
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  meeting_intel_pgdata:
